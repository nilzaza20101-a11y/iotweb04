<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Monomaniac+One&display=swap" rel="stylesheet">
    <style>
        body{
            background-color: black;
        }
        a, i{
            color: white;
            font-size: 1.5rem;
        }
        .nav-hello span{
            color: greenyellow;
            font-family:Dancing Script;
            font-size: 3.5rem;
        }
        .nav-menu a{
            font-family: monomaniac one;
            text-decoration: none;
        }
        .nav-bar{
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 50px 80px; //*บน-ล่าง /ซ.ข*/
        }
        .nav-menu, .nav-hello, .nav-icon{
            width: 100%;
        }
        .nav-hello{
            text-align: center;
        }
        .nav-icon{
            /*text-align: right;*/
            display: flex;
            justify-content: flex-end;
            gap: 30px;
        }
        .nav-menu{
            display: flex;
            gap: 30px;
        }
        .per-info span{
            color: white;
            font-family: monomaniac one;
            font-size: 2.5rem;
        }
        .per-info{
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 100px;
        }
        #fwd{
            color: greenyellow;
        }
        .per-pic{
            margin-top: 150px;
            display: flex;
            justify-content: center;
        }
        img{
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 100%;
            border: 5px solid rgb(141, 141, 232);
            padding: 15px;
        }
        a:hover{
            color: orange;
        }
        i:hover{
            color: olivedrab;
        }
    </style>
</head>
<body>
    <div class="container">
        <!--ส่วนของ navbar-->
        <div class="nav-bar">
            <!--เมนูต่างๆ ชิดซ้าย-->
            <div class="nav-menu">
                <a href="#">Portfolio</a>
                <a href="#">About Me</a>
                <a href="#">Get In Touch</a>
            </div>
            <!--ข้อความ Hello อยู่ตรงกลาง-->
            <div class="nav-hello">
                <span>hello</span>
            </div>
            <!--ไอคอนต่างๆ ชิดขวา-->
            <div class="nav-icon">
               <a href="#"></a><i class="bi bi-github"></i>
               <a href="#"></a><i class="bi bi-instagram"></i>
               <a href="#"></a><i class="bi bi-twitter"></i>
               <a href="#"></a><i class="bi bi-linkedin"></i>
            </div>
        </div>
        <!---ส่วนของ personal info--> 
        <div class="per-info">
            <span>6819M10003</span>
            <span>Sira Khemsee</span>
            <span id="fwd">Freelance Web Dwvloper</span>
            <span>Based In THAILAND</span>
        </div>
        <!---ส่วนของ personal picture-->   
        <div class="per-pic">
        <img src="./images/person.jpg" alt="person">
        </div>
    </div>
</body>
</html>
